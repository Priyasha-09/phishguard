databases:
  - name: phishguard-db
    plan: basic-256mb
    databaseName: phishguard
    user: phishguard

services:
  - type: web
    name: phishguard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        fromDatabase:
          name: phishguard-db
          property: connectionString